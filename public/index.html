<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Job Tracker</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <h1>Job Tracker</h1>
        <p id="summary" class="muted" aria-live="polite"></p>
      </div>
      <div class="actions">
        <label class="visually-hidden" for="search">Search applications</label>
        <input id="search" type="search" placeholder="Search company, role, notes" autocomplete="off" />
        <button id="add" class="primary" type="button">+ Add application</button>
      </div>
    </header>

    <section id="reminders" class="reminders" hidden aria-label="Follow-up reminders">
      <h2 id="reminders-title"></h2>
      <ul id="reminders-list"></ul>
    </section>

    <main id="board" class="board" aria-label="Application board"></main>

    <dialog id="dialog" aria-labelledby="dialog-title">
      <form id="form" novalidate>
        <h2 id="dialog-title">Add application</h2>

        <div class="grid">
          <label>Company *
            <input name="company" required maxlength="200" />
          </label>
          <label>Role *
            <input name="role" required maxlength="200" />
          </label>
          <label>Status
            <select name="status" id="status-select"></select>
          </label>
          <label>Location
            <input name="location" maxlength="200" />
          </label>
          <label>Applied on
            <input name="appliedDate" type="date" />
          </label>
          <label>Follow up on
            <input name="followUpDate" type="date" />
          </label>
        </div>

        <label>Job posting URL
          <input name="url" type="url" maxlength="2000" placeholder="https://" />
        </label>
        <label>Notes
          <textarea name="notes" rows="4" maxlength="5000"></textarea>
        </label>

        <ul id="form-errors" class="errors" role="alert"></ul>

        <div class="dialog-actions">
          <button id="delete" class="danger" type="button" hidden>Delete</button>
          <span class="spacer"></span>
          <button id="cancel" type="button">Cancel</button>
          <button class="primary" type="submit">Save</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/app.js"></script>
  </body>
</html>
